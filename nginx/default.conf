upstream nextjs_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Vouchers/avatares subidos por usuarios (ver ManualPaymentSection, AvatarUploader)
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Assets hasheados de Next.js: cacheables de forma agresiva e inmutable
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

